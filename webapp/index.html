<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Matthew</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #ffffff;
    --chat-bg: #ffffff;
    --sent-bg: #007AFF;
    --sent-text: #ffffff;
    --recv-bg: #E9E9EB;
    --recv-text: #000000;
    --input-bg: #F2F2F7;
    --input-border: #C7C7CC;
    --bar-bg: #F8F8FA;
    --bar-border: #C6C6C8;
    --text-secondary: #8E8E93;
    --overlay-bg: rgba(0,0,0,0.3);
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* ===== Top Bar ===== */
.top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    background: var(--bar-bg);
    border-bottom: 0.5px solid var(--bar-border);
    position: relative;
    flex-shrink: 0;
}
.top-bar .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #007AFF;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    margin-right: 10px;
}
.top-bar .name {
    font-size: 17px;
    font-weight: 600;
    color: #000;
}
.top-bar .status {
    font-size: 12px;
    color: var(--text-secondary);
}
.top-bar .settings-btn {
    position: absolute;
    right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: #007AFF;
    padding: 4px;
}

/* ===== Chat Area ===== */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.message {
    max-width: 70%;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.35;
    word-wrap: break-word;
    animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.sent {
    align-self: flex-end;
    background: var(--sent-bg);
    color: var(--sent-text);
    border-bottom-right-radius: 6px;
}
.message.received {
    align-self: flex-start;
    background: var(--recv-bg);
    color: var(--recv-text);
    border-bottom-left-radius: 6px;
}

/* Consecutive messages from same sender: tighter spacing, adjusted radius */
.message.sent + .message.sent {
    border-top-right-radius: 6px;
    margin-top: 1px;
}
.message.received + .message.received {
    border-top-left-radius: 6px;
    margin-top: 1px;
}

/* ===== Typing Indicator ===== */
.typing-indicator {
    align-self: flex-start;
    background: var(--recv-bg);
    border-radius: 18px;
    border-bottom-left-radius: 6px;
    padding: 10px 16px;
    display: none;
    gap: 4px;
    align-items: center;
    animation: fadeIn 0.15s ease-out;
}
.typing-indicator.visible { display: flex; }
.typing-indicator .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #999;
    animation: typingBounce 1.4s infinite ease-in-out;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
}

/* ===== Input Bar ===== */
.input-bar {
    display: flex;
    align-items: flex-end;
    padding: 8px 12px;
    background: var(--bar-bg);
    border-top: 0.5px solid var(--bar-border);
    gap: 8px;
    flex-shrink: 0;
}
.emoji-btn {
    background: none;
    border: none;
    font-size: 26px;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
    line-height: 1;
}
.input-wrapper {
    flex: 1;
    position: relative;
}
.input-wrapper textarea {
    width: 100%;
    border: 1px solid var(--input-border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.35;
    max-height: 120px;
    overflow-y: auto;
    background: var(--input-bg);
}
.input-wrapper textarea:focus {
    border-color: #007AFF;
}
.send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #007AFF;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
}
.send-btn:disabled {
    opacity: 0.4;
    cursor: default;
}
.send-btn svg {
    fill: white;
    width: 18px; height: 18px;
}

/* ===== Connection Status ===== */
.connection-status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 100;
    display: none;
}
.connection-status.visible { display: block; }

/* ===== Settings Panel ===== */
.settings-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    z-index: 200;
    display: none;
    justify-content: center;
    align-items: center;
}
.settings-overlay.visible { display: flex; }
.settings-panel {
    background: white;
    border-radius: 16px;
    padding: 24px;
    width: 320px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.settings-panel h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 20px;
}
.settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}
.settings-row label {
    font-size: 15px;
    color: #333;
}
.settings-row input[type="range"] {
    width: 140px;
    accent-color: #007AFF;
}
.settings-row .value {
    font-size: 14px;
    color: var(--text-secondary);
    min-width: 40px;
    text-align: right;
}
.settings-close {
    width: 100%;
    padding: 10px;
    background: #007AFF;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
}

/* ===== Emoji Picker ===== */
.emoji-picker {
    position: fixed;
    bottom: 60px;
    left: 12px;
    right: 12px;
    max-width: 380px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    z-index: 150;
    display: none;
    flex-direction: column;
    max-height: 320px;
}
.emoji-picker.visible { display: flex; }
.emoji-tabs {
    display: flex;
    border-bottom: 1px solid #eee;
    padding: 6px 8px 0;
    gap: 2px;
    flex-shrink: 0;
}
.emoji-tabs button {
    background: none;
    border: none;
    font-size: 20px;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    opacity: 0.5;
}
.emoji-tabs button.active { opacity: 1; background: #f0f0f0; }
.emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 2px;
    padding: 8px;
    overflow-y: auto;
}
.emoji-grid button {
    background: none;
    border: none;
    font-size: 24px;
    padding: 6px;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.1s;
}
.emoji-grid button:hover { background: #f0f0f0; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <div class="avatar">M</div>
    <div>
        <div class="name">Matthew</div>
        <div class="status" id="status-text">Connecting...</div>
    </div>
    <button class="settings-btn" id="settings-btn" title="Settings">⚙️</button>
</div>

<!-- Chat Area -->
<div class="chat" id="chat">
    <div class="typing-indicator" id="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

<!-- Connection Status Toast -->
<div class="connection-status" id="conn-status">Connecting...</div>

<!-- Input Bar -->
<div class="input-bar">
    <button class="emoji-btn" id="emoji-btn" title="Emoji">😊</button>
    <div class="input-wrapper">
        <textarea id="input" rows="1" placeholder="iMessage"></textarea>
    </div>
    <button class="send-btn" id="send-btn" disabled title="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
</div>

<!-- Emoji Picker -->
<div class="emoji-picker" id="emoji-picker">
    <div class="emoji-tabs" id="emoji-tabs"></div>
    <div class="emoji-grid" id="emoji-grid"></div>
</div>

<!-- Settings Panel -->
<div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel">
        <h3>Settings</h3>
        <div class="settings-row">
            <label>Retry timeout</label>
            <input type="range" id="timeout-slider" min="1000" max="30000" step="1000" value="5000">
            <span class="value" id="timeout-value">5s</span>
        </div>
        <div class="settings-row">
            <label>Temperature</label>
            <input type="range" id="temp-slider" min="0" max="20" step="1" value="10">
            <span class="value" id="temp-value">1.0</span>
        </div>
        <button class="settings-close" id="settings-close">Done</button>
    </div>
</div>

<script>
// ===== State =====
const messages = [];       // {sender: "iris"|"matthew", text: "..."}
let ws = null;
let connected = false;
let piReady = false;
let timeoutMs = 5000;

// ===== DOM =====
const chatEl = document.getElementById("chat");
const typingEl = document.getElementById("typing");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const statusText = document.getElementById("status-text");
const connStatus = document.getElementById("conn-status");

// ===== WebSocket =====
function connectWS() {
    ws = new WebSocket("ws://localhost:8765");

    ws.onopen = () => {
        connected = true;
        hideConnStatus();
        statusText.textContent = piReady ? "Pi Connected" : "Waiting for Pi...";
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "ready") {
            piReady = true;
            statusText.textContent = "Pi Connected";
        } else if (data.type === "typing") {
            showTyping();
        } else if (data.type === "message") {
            hideTyping();
            addMessage("matthew", data.text);
        } else if (data.type === "idle") {
            hideTyping();
        } else if (data.type === "retry") {
            hideTyping();
            // Pi will retry after timeout — no UI indicator needed
        }
    };

    ws.onclose = () => {
        connected = false;
        piReady = false;
        statusText.textContent = "Disconnected";
        showConnStatus("Reconnecting...");
        setTimeout(connectWS, 2000);
    };

    ws.onerror = () => {
        ws.close();
    };
}

// ===== Messages =====
function addMessage(sender, text) {
    messages.push({ sender, text });
    renderMessage(sender, text);
    scrollToBottom();
}

function renderMessage(sender, text) {
    const el = document.createElement("div");
    el.className = "message " + (sender === "iris" ? "sent" : "received");
    el.textContent = text;
    // Insert before typing indicator
    chatEl.insertBefore(el, typingEl);
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
    });
}

// ===== Typing Indicator =====
function showTyping() {
    typingEl.classList.add("visible");
    scrollToBottom();
}
function hideTyping() {
    typingEl.classList.remove("visible");
}

// ===== Connection Status Toast =====
function showConnStatus(text) {
    connStatus.textContent = text;
    connStatus.classList.add("visible");
}
function hideConnStatus() {
    connStatus.classList.remove("visible");
}

// ===== Build History =====
function buildHistory() {
    return messages.map(m => {
        const prefix = m.sender === "iris" ? "I" : "M";
        return prefix + ": " + m.text;
    }).join("\n") + "\n";
}

// ===== Send Message =====
function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !connected) return;

    addMessage("iris", text);
    inputEl.value = "";
    autoResize();
    updateSendBtn();

    // Send full conversation history to Pi
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: "send",
            history: buildHistory(),
            timeout: timeoutMs
        }));
    }
}

// ===== Input Handling =====
inputEl.addEventListener("input", () => {
    autoResize();
    updateSendBtn();
});

inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener("click", sendMessage);

function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}

function updateSendBtn() {
    sendBtn.disabled = !inputEl.value.trim();
}

// ===== Settings =====
const settingsOverlay = document.getElementById("settings-overlay");
const timeoutSlider = document.getElementById("timeout-slider");
const timeoutValue = document.getElementById("timeout-value");
const tempSlider = document.getElementById("temp-slider");
const tempValue = document.getElementById("temp-value");

document.getElementById("settings-btn").addEventListener("click", () => {
    settingsOverlay.classList.add("visible");
});
document.getElementById("settings-close").addEventListener("click", () => {
    settingsOverlay.classList.remove("visible");
});
settingsOverlay.addEventListener("click", (e) => {
    if (e.target === settingsOverlay) settingsOverlay.classList.remove("visible");
});

timeoutSlider.addEventListener("input", () => {
    timeoutMs = parseInt(timeoutSlider.value);
    timeoutValue.textContent = (timeoutMs / 1000) + "s";
});

tempSlider.addEventListener("input", () => {
    const val = parseInt(tempSlider.value) / 10;
    tempValue.textContent = val.toFixed(1);
});

// ===== Emoji Picker =====
const EMOJIS = {
    "😀": ["😀","😂","🥹","😍","🥰","😘","😎","🤩","🥳","🤔","🫠","😭","😤","🫡","💀","🤡","👻","😈","🙄","😴","🤮","🥶","🥵","😱","🤯","🫣","😏","😇","🤪","😋"],
    "❤️": ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","💕","💞","💓","💗","💖","💘","💝","❣️","💔","🫶","✨","🔥","⭐","💫","🌟","💥","💢","💤","💯","🎉","🎊","🎈"],
    "👋": ["👋","👍","👎","👊","✊","🤞","✌️","🤘","🤙","👈","👉","👆","👇","☝️","🫵","👏","🙌","🤝","🙏","💪","🫂","🤷","🤦","🫰","🤌","👀","🧠","💅","🦾","🫀"],
    "🐶": ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧","🐦","🦄","🐝","🐛","🦋","🐌","🐞","🐢","🐍","🦎","🐙","🐠","🐳"],
    "🍕": ["🍕","🍔","🍟","🌮","🌯","🍣","🍜","🍝","🍰","🎂","🍩","🍪","🍫","🍬","🧋","☕","🍺","🍷","🥂","🧃","🍎","🍌","🍑","🍓","🥑","🌽","🥦","🍆","🫑","🥕"],
    "⚽": ["⚽","🏀","🏈","⚾","🎾","🏐","🎱","🏓","🏸","🥊","🎮","🕹️","🎲","🎯","🏆","🥇","🎪","🎭","🎨","🎬","🎤","🎧","🎵","🎶","🎹","🎸","🥁","🎻","🎺","🪗"],
    "🚗": ["🚗","🚕","🚌","🏎️","🚓","🚑","🚒","🛻","🚜","🛵","🚲","✈️","🚀","🛸","🚁","⛵","🚢","🏠","🏢","🏫","⛪","🗼","🗽","🏰","🌉","🎡","🎢","⛲","🏖️","🌋"],
    "💡": ["💡","📱","💻","⌨️","🖥️","📷","📞","⏰","🔔","📌","📎","✂️","🔑","🔒","💰","💎","🧲","🔧","🛠️","⚙️","📦","🏷️","📋","📅","📊","📈","🗓️","✏️","📝","📚"]
};

const emojiTabs = document.getElementById("emoji-tabs");
const emojiGrid = document.getElementById("emoji-grid");
const emojiPicker = document.getElementById("emoji-picker");
const emojiBtn = document.getElementById("emoji-btn");

// Build tabs
const categories = Object.keys(EMOJIS);
categories.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    if (i === 0) btn.classList.add("active");
    btn.addEventListener("click", () => {
        document.querySelectorAll(".emoji-tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderEmojiGrid(cat);
    });
    emojiTabs.appendChild(btn);
});

function renderEmojiGrid(category) {
    emojiGrid.innerHTML = "";
    EMOJIS[category].forEach(emoji => {
        const btn = document.createElement("button");
        btn.textContent = emoji;
        btn.addEventListener("click", () => {
            inputEl.value += emoji;
            inputEl.focus();
            autoResize();
            updateSendBtn();
        });
        emojiGrid.appendChild(btn);
    });
}
renderEmojiGrid(categories[0]);

emojiBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    emojiPicker.classList.toggle("visible");
});

// Close emoji picker when clicking elsewhere
document.addEventListener("click", (e) => {
    if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
        emojiPicker.classList.remove("visible");
    }
});

// ===== Init =====
showConnStatus("Connecting...");
connectWS();
inputEl.focus();
</script>
</body>
</html>
